# Configuration for Indian Financial Data Analysis

# Logging configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_file: "logs/financial_data.log"
  console_output: true

# Timeout configuration
timeout_config:
  enrichment_timeout: 300  # API enrichment timeout in seconds (aligned with per-fund timeout)
  fetcher_timeout: 120     # Individual fetcher timeout in seconds (aligned with per-fund timeout)

# Retry configuration for resilience
retry_config:
  max_retries: 3           # Maximum number of retry attempts
  initial_delay: 1         # Initial delay in seconds (exponential backoff)
  max_delay: 10            # Maximum delay in seconds
  backoff_multiplier: 2    # Exponential backoff multiplier
  retry_on_timeout: true   # Retry on timeout errors
  retry_on_server_error: true  # Retry on 5xx errors

# Feature flags for optional functionality
feature_flags:
  correlation_id_tracking:
    enabled: true
  concurrent_enrichment:
    enabled: true
    max_concurrent: 5
    # Per-fund timeout in seconds. If omitted, the service computes a sensible
    # default based on fetcher timeout and MFAPI timeout (max(fetcher_timeout, mfapi.timeout * 6)).
    # Recommended: 60 or 120 depending on expected external latency.
    timeout_per_fund: 120  # seconds

# Data validation thresholds
validation:
  nav:
    min_value: 0.01
    max_value: 100000
    max_age_days: 7
  
  holdings:
    value_deviation_tolerance: 0.02  # Allow 2% deviation in units*nav vs reported value
  
  sector_breakdown:
    min_sectors: 3
    total_percentage_tolerance: 1.0  # Allow 1% deviation from 100%
  
  index_data:
    min_constituents: 10
    max_price_change_percent: 20  # Alert if daily change > 20%

# MFAPI.in configuration (Primary fund resolution and NAV source)
# API Docs: https://www.mfapi.in/docs/
mfapi:
  timeout: 60                    # Request timeout in seconds
  max_retries: 3                 # Max retry attempts for failed requests
  fuzzy_threshold: 85            # RapidFuzz token_set_ratio threshold (0-100)
  base_url: "https://api.mfapi.in"  # Base URL for MFAPI (do not change)
  endpoints:
    search: "/mf/search"         # Search endpoint: GET /mf/search?q={query}
    latest: "/mf/{scheme_code}/latest"  # NAV endpoint: GET /mf/{scheme_code}/latest

# Enrichment configuration
enrichment:
  # Temporary: best_scheme_threshold no longer used (mftool/FundResolver removed)
  best_scheme_threshold: 0.65  # DEPRECATED - kept for backward compatibility

# Data source configurations (DEPRECATED)
data_sources:
  mftool:
    enabled: false          # DEPRECATED - Replaced by MFAPI
    timeout: 30
  
  yahooquery:
    enabled: true
    timeout: 30
  
  jugaad_data:
    enabled: true
    timeout: 30
  
  morningstar:
    enabled: true
    timeout: 30

# ISIN data configuration (DEPRECATED)
# ISIN is now fetched directly from MFAPI.in in the search_and_get_fund() method
# This section kept for reference only. Can be removed in future releases.
isin_data:
  cache_dir: "data/isin_cache"           # DEPRECATED
  cache_ttl_days: 7                      # DEPRECATED
  auto_load_on_startup: false            # DEPRECATED - Set to false, not used in new flow
  log_stale_warning: false               # DEPRECATED
  fuzzy_match_threshold: 90              # DEPRECATED
  
  # Fund resolver settings (DEPRECATED - FundResolver removed)
  fund_resolver:
    prefer_direct_plan: true             # DEPRECATED
    rapidfuzz_token_set_threshold: 85    # DEPRECATED
    rapidfuzz_wratio_fallback: 75        # DEPRECATED
    max_candidate_logging: 3             # DEPRECATED
